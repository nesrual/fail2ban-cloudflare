[Definition]

# Every line in the Roboo challenge log means a client was (re)challenged.
# The client address is the first token of each nginx access-log line, so
# <HOST> anchored at the start captures it. This matches IPv4 and IPv6 alike
# (nginx logs the raw IPv6 address, unbracketed, as the first token).
failregex = ^<HOST> .*$

ignoreregex =

# IPv4 sample line:
# 11.22.33.44 www.my-website.com - [13/May/2015:10:21:06 +0000] "GET / HTTP/1.1" 200 767 "-" "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_10_3) AppleWebKit/600.5.17 (KHTML, like Gecko) Version/8.0.5 Safari/600.5.17" "-"
#
# IPv6 sample line:
# 2001:db8::1 www.my-website.com - [13/May/2015:10:21:06 +0000] "GET / HTTP/1.1" 200 767 "-" "Mozilla/5.0 ..." "-"
#
# NOTE: if nginx sits behind Cloudflare, $remote_addr is Cloudflare's edge IP
# unless ngx_http_realip_module is configured (set_real_ip_from <CF ranges> +
# real_ip_header CF-Connecting-IP). Without it, this filter matches Cloudflare
# IPs — whitelist the Cloudflare ranges in jail ignoreip (see README).
