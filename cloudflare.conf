# Fail2Ban action: ban/unban an IP at Cloudflare via IP Access Rules (API v4).
#
# Works for both IPv4 and IPv6 — the script maps <ip> to the correct Cloudflare
# target (ip / ip6 / ip_range) itself, so no family branching is needed here.
#
# Credentials and scope are read by the script from /etc/fail2ban/cloudflare.env
# (see cloudflare.env.example). Nothing sensitive lives in this file.
#
# Adjust the two /path/to placeholders below to your ruby binary and the
# location where you installed cloudflare_api_manager.rb.

[Definition]

# Option:  actionstart / actionstop / actioncheck
# Notes.:  nothing to set up or tear down for an API-based ban.
actionstart =
actionstop  =
actioncheck =

# Option:  actionban
# Notes.:  executed when banning an IP, with Fail2Ban user rights.
#          <ip> expands to the bare IPv4 or IPv6 address.
actionban = /path/to/ruby /path/to/cloudflare_api_manager.rb ban <ip>

# Option:  actionunban
# Notes.:  executed when unbanning an IP, with Fail2Ban user rights.
actionunban = /path/to/ruby /path/to/cloudflare_api_manager.rb unban <ip>

[Init]
